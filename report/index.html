  <!-- 🛡️ IMMEDIATE SELF-HEALING: Purge corrupted tombstones and restore full 205-task workbook on startup -->
  <script>
    (function() {
      // Ensure canonical trailing slash if accessed via /report
      if (window.location.pathname === '/report') {
        window.location.replace('/report/' + window.location.search + window.location.hash);
        return;
      }
      try {
        // Clear corrupted local deleted task IDs so all 9 engineers appear
        localStorage.removeItem('walton_deleted_task_ids');

        // Check if cached workbook has only partial tasks (< 100) and reset so all 205 tasks rehydrate
        var rawWb = localStorage.getItem('walton_pd_month_workbooks_v2');
        if (rawWb) {
          var wb = JSON.parse(rawWb);
          if (wb && wb['SEP-2026'] && Array.isArray(wb['SEP-2026']) && wb['SEP-2026'].length < 100) {
            delete wb['SEP-2026'];
            localStorage.setItem('walton_pd_month_workbooks_v2', JSON.stringify(wb));
          }
        }
      } catch (e) {}
    })();
  </script>
